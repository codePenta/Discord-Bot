services:
  discord-bot:
    image: cdpenta/discord-bot:latest
    pull_policy: always
    container_name: discord-bot
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    networks:
      - db-net
    volumes:
      - bot-data:/usr/src/app/data

volumes:
  bot-data:

networks:
  db-net:
    external: true